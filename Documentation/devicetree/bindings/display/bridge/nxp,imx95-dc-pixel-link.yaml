%YAML 1.2
---
$id: http://devicetree.org/schemas/display/bridge/nxp,imx95-dc-pixel-link.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP i.MX95 Display Pixel Link

maintainers:
  - NXP Semiconductor <imx@lists.linux.dev>

description: |
  The i.MX95 Display Pixel Link forms an asynchronous crossbar linkage
  between pixel sources (pixel interleaver output channels) and pixel
  consumers (LVDS Display Bridge, MIPI DSI, etc.). It is implemented
  as a set of registers within the Display Master CSR syscon.

  Each of the two pixel streams has one input port and one output port.
  Output ports may have multiple endpoints to support routing the same
  stream to different downstream bridges.

properties:
  compatible:
    const: nxp,imx95-dc-pixel-link

  reg:
    maxItems: 1
    description:
      Offset of the pixel link control register within the parent
      Display Master CSR syscon.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input port for stream 0 from pixel interleaver channel 0.

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input port for stream 1 from pixel interleaver channel 1.

      port@2:
        $ref: /schemas/graph.yaml#/properties/port
        description: Output port for stream 0 to downstream bridge(s).

      port@3:
        $ref: /schemas/graph.yaml#/properties/port
        description: Output port for stream 1 to downstream bridge(s).

    required:
      - port@0
      - port@1
      - port@2
      - port@3

required:
  - compatible
  - reg
  - ports

additionalProperties: false

examples:
  - |
    dispmix_csr: syscon@4b010000 {
        compatible = "nxp,imx95-display-csr", "syscon", "simple-mfd";
        reg = <0x4b010000 0x10000>;

        display-pixel-link@8 {
            compatible = "nxp,imx95-dc-pixel-link";
            reg = <0x8>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;

                    endpoint {
                        remote-endpoint = <&pixel_interleaver_ch0_out>;
                    };
                };

                port@1 {
                    reg = <1>;

                    endpoint {
                        remote-endpoint = <&pixel_interleaver_ch1_out>;
                    };
                };

                port@2 {
                    reg = <2>;

                    endpoint {
                        remote-endpoint = <&ldb_ch0_in>;
                    };
                };

                port@3 {
                    reg = <3>;

                    endpoint {
                        remote-endpoint = <&ldb_ch1_in>;
                    };
                };
            };
        };
    };
