%YAML 1.2
---
$id: http://devicetree.org/schemas/display/bridge/fsl,imx95-ldb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale i.MX95 LVDS Display Bridge

maintainers:
  - NXP Semiconductor <imx@lists.linux.dev>

description: |
  The Freescale i.MX95 LVDS Display Bridge (LDB) serializes parallel RGB
  data from the display pipeline into LVDS output. It has two channels,
  each with an LVDS PHY. Each channel can be used independently for a
  single-link LVDS display, or both channels can be used together in
  split mode for a dual-link LVDS display.

  The i.MX95 LDB is controlled by Control and Status Registers (CSR)
  within the LVDS CSR syscon. The LDB node is a child of the syscon.

properties:
  compatible:
    const: fsl,imx95-ldb

  reg:
    maxItems: 1
    description:
      Offset of the LDB control register within the parent LVDS CSR syscon.

  clocks:
    minItems: 4
    maxItems: 4

  clock-names:
    items:
      - const: ldb_ch0
      - const: ldb_di0
      - const: ldb_ch1
      - const: ldb_di1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^channel@[0-1]$":
    type: object
    description: Represents a channel of LDB.

    properties:
      "#address-cells":
        const: 1

      "#size-cells":
        const: 0

      reg:
        description: The channel index.
        enum: [0, 1]

      phys:
        description: A phandle to the LVDS PHY for this channel.
        maxItems: 1

      phy-names:
        const: lvds_phy

      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Input port of the channel, connected to a pixel link
          output port.

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Output port of the channel, connected to an LVDS display
          or LVDS-to-HDMI bridge (e.g. IT6263).

    required:
      - "#address-cells"
      - "#size-cells"
      - reg
      - phys
      - phy-names
      - port@1

    additionalProperties: false

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#address-cells"
  - "#size-cells"

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: fsl,imx95-ldb
    then:
      properties:
        channel@0: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/nxp,imx95-clock.h>

    lvds_csr: syscon@4b0c0000 {
        compatible = "nxp,imx95-lvds-csr", "syscon", "simple-mfd";
        reg = <0x4b0c0000 0x10000>;

        ldb@4 {
            compatible = "fsl,imx95-ldb";
            reg = <0x4>;
            clocks = <&lvds_csr 1>,
                     <&lvds_csr 3>,
                     <&lvds_csr 2>,
                     <&lvds_csr 4>;
            clock-names = "ldb_ch0", "ldb_di0",
                          "ldb_ch1", "ldb_di1";
            #address-cells = <1>;
            #size-cells = <0>;

            channel@0 {
                #address-cells = <1>;
                #size-cells = <0>;
                reg = <0>;
                phys = <&ldb0_phy>;
                phy-names = "lvds_phy";

                port@1 {
                    reg = <1>;

                    endpoint {
                        remote-endpoint = <&lvds_panel>;
                    };
                };
            };

            channel@1 {
                #address-cells = <1>;
                #size-cells = <0>;
                reg = <1>;
                phys = <&ldb1_phy>;
                phy-names = "lvds_phy";

                port@1 {
                    reg = <1>;

                    endpoint {
                        remote-endpoint = <&it6263_in>;
                    };
                };
            };
        };

        ldb0_phy: phy@8 {
            compatible = "fsl,imx95-lvds0-phy";
            reg = <0x8>;
            #phy-cells = <0>;
        };

        ldb1_phy: phy@c {
            compatible = "fsl,imx95-lvds1-phy";
            reg = <0xc>;
            #phy-cells = <0>;
        };
    };
