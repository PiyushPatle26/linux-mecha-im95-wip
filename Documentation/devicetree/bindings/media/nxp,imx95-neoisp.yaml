%YAML 1.2
---
$id: http://devicetree.org/schemas/media/nxp,imx95-neoisp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP NEOISP Image Signal Processing Pipeline

maintainers:
  - Antoine Bouyer <antoine.bouyer@nxp.com>

description:
  The NXP NEOISP performs a set of image processing tasks on the RAW camera
  stream and provides RGB or YUV enhanced image.

properties:
  compatible:
    enum:
      - nxp,imx95-neoisp

  reg:
    items:
      - description: The configuration registers
      - description: ISP local memories

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: AXI bus clock
      - description: pixel clock
      - description: ISP core clock

  clock-names:
    items:
      - const: camblk_isp_axi
      - const: camblk_isp_pixel
      - const: camblk_isp

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - power-domains

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    isp@4ae00000 {
        compatible = "nxp,imx95-neoisp";
        reg = <0x4ae00000 0x8000>,
              <0x4afe0000 0x10000>;
        interrupts = <GIC_SPI 222 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-parent = <&gic>;
        clocks = <&cameramix_csr 0>, <&cameramix_csr 1>, <&cameramix_csr 2>;
        clock-names = "camblk_isp_axi", "camblk_isp_pixel", "camblk_isp";
        power-domains = <&scmi_devpd 3>; /* IMX95_PD_CAMERA */
    };
